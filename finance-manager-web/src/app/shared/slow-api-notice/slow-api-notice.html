@if (loading.isSlow()) {
  <div class="slow-api-notice" role="status" aria-live="polite">
    <span class="slow-api-notice__indicator" aria-hidden="true"></span>
    <div>
      <strong>O servidor está demorando um pouco</strong>
      <p>Se estava inativo, a primeira resposta pode levar cerca de um minuto. Seus dados continuam sendo carregados.</p>
    </div>
  </div>
}
