spring.application.name=finance-manager-api
spring.profiles.default=dev

server.port=${PORT:${SERVER_PORT:8080}}

spring.jpa.open-in-view=false
spring.flyway.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Finance Manager API v1
springdoc.swagger-ui.urls[0].url=/api-docs/v1
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/v1/**

# JWT
app.jwt.issuer=${JWT_ISSUER:finance-manager-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.jackson.deserialization.accept-float-as-int=false

# Sugestões de transação com Gemini
spring.ai.model.chat=${TRANSACTION_SUGGESTION_PROVIDER:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
# A dedicated RetryTemplate owns generation retries; SDK and automatic retries stay single-attempt.
spring.ai.retry.max-attempts=1

# Transaction category history is enabled only for the configured pilot users.
finance-manager.transaction-chat.rag.enabled=${TRANSACTION_CHAT_RAG_ENABLED:false}
finance-manager.transaction-chat.rag.pilot-user-ids=${TRANSACTION_CHAT_RAG_PILOT_USER_IDS:}
finance-manager.transaction-chat.rag.search-timeout=${TRANSACTION_CHAT_RAG_SEARCH_TIMEOUT:2s}
finance-manager.transaction-chat.rag.min-similarity=${TRANSACTION_CHAT_RAG_MIN_SIMILARITY:0.55}
logging.level.com.rodrigs.finance_manager_api.transaction.rag.TransactionRagRetriever=${TRANSACTION_CHAT_RAG_LOG_LEVEL:INFO}
# Provider retry failures may include request details. The suggestion service logs only the exception type.
logging.level.org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration=ERROR
