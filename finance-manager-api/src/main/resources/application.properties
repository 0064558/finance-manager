spring.application.name=finance-manager-api
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.flyway.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Finance Manager API v1
springdoc.swagger-ui.urls[0].url=/api-docs/v1
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/v1/**

# JWT
app.jwt.issuer=${JWT_ISSUER:finance-manager-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.secret=${JWT_SECRET}