spring.datasource.url=${FINANCE_MANAGER_TEST_DB_URL:jdbc:postgresql://localhost:5432/finance_manager_test}
spring.datasource.username=${FINANCE_MANAGER_TEST_DB_USERNAME:finance_manager_test}
spring.datasource.password=${FINANCE_MANAGER_TEST_DB_PASSWORD:finance_manager_test}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

app.jwt.issuer=finance-manager-api-test
app.jwt.expiration-seconds=3600
app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
