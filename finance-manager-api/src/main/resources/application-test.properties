spring.datasource.url=${FINANCE_MANAGER_TEST_DB_URL:jdbc:h2:mem:finance_manager_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${FINANCE_MANAGER_TEST_DB_USERNAME:sa}
spring.datasource.password=${FINANCE_MANAGER_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${FINANCE_MANAGER_TEST_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=${FINANCE_MANAGER_TEST_FLYWAY_ENABLED:false}

app.jwt.issuer=finance-manager-api-test
app.jwt.expiration-seconds=3600
app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
